    <script>
        // ====================== ORIGINAL NAME DATASETS ===================
        const maleFirst = ["Rohan","Rohim","Mahmud","Asif","Nasir","Tanvir","Sayem","Rubel","Saif","Ridoy","Faruk","Arif","Momin","Imran","Ziaul","Shahin","Sohel","Borhan","Riyan","Tauhar","Siddiq","Hasan","Masud","Jaber","Arman","Nurul","Saiful","Faizul","Junayed","Bilal","Mithun","Suman","Nur","Muhurt","Kanj","Alam","Palash","Arnab","Shifat","Nimrud","Rifat","Tamim","Kaiyum","Saikat","Rubayet","Salahuddin","Imtiaz","Humayun","Jannat","Sami","Rafiqul","Shafiqul","Monir","Rasel","Shahriar","Fahim","Nazmul","Shuvo","Tuhin","Nayeem","Rafi","Zakir","Farhan","Mehedi","Rakib","Mahfuz","Sabbir","Jewel","Shakil","Mohiuddin","Sourav","Rashed","Shahriar","Tanveer","Shanto","Ibrahim","Samiul","Moin","Ashik","Mahin","Raihan","Azad","Shafik","Sahed","Tahmid","Riyadul","Noman","Arifur","Shamim","Fahad","Sumon","Rashedul","Junaid","Shahadat","Mahbub","Sohag","Shahid","Abir","Asad","Nayeem","Helal","Kuddus","Emran","Kamal","Kalam","Rocky"];
        const femaleFirst = ["Faria","Sabana","Noor","Rina","Shahina","Tarao","Momota","Sana","Sumaiya","Tasnim","Mahiya","Rabeya","Apu","Rima","Nabila","Sabrina","Nishita","Jesia","Saikati","Tania","Shrabonti","Milena","Tahmina","Polki","Monalisa","Anika","Khanija","Mitu","Shiuli","Pria","Sajal","Mili","Rin","Farah","Saba","Mahi","Jannat","Koel","Irina","Raima","Mohi","Pabna","Nishin","Tushari","Mahidi","Roksana","Ankita","Sherina","Mohua","Hridoya","Fahmida","Sharmin","Mousumi","Shirin","Rumana","Ayesha","Rumana","Nusrat","Sumaiya","Mahamuda","Shapla","Rina","Farzana","Roksana","Sadia","Shathi","Nabila","Tania","Farah","Moushumi","Sadia","Sharmin","Mim","Mitu","Nazia","Sabrina","Shaila","Mahima","Raisa","Mili","Soma","Pria","Anika","Tahmina","Sushmita","Mimi","Nishita","Koel","Jannat","Irina","Raima","Mohi","Pabna","Nishin","Tushari","Mahidi","Roksana","Ankita","Sherina","Mohua","Mithila","Shifa","Payel","Moyna","Omi"];
        const surnames = ["Chowdhury","Khan","Roy","Ahmed","Sarkar","Biswas","Talukdar","Majumdar","Molla","Karim","Mollah","Siddiquie","Munshi","Faruqi","Alam","Jahan","Mallick","Shah","Sikdar","Miraz","Zaman","Kabir","Akter","Haque","Chakraborty","Gazi","Kazi","Farooqui","Shikder","Uddin","Mazumder","Noor"];

        function getSelectedType() {
            return document.querySelector('input[name="gender"]:checked').value;
        }

        function getRandomName(type) {
            let first;
            if (type === "male") {
                first = maleFirst[Math.floor(Math.random() * maleFirst.length)];
            } else if (type === "female") {
                first = femaleFirst[Math.floor(Math.random() * femaleFirst.length)];
            } else {
                const isMale = Math.random() < 0.5;
                first = isMale ? maleFirst[Math.floor(Math.random() * maleFirst.length)] : femaleFirst[Math.floor(Math.random() * femaleFirst.length)];
            }
            const last = surnames[Math.floor(Math.random() * surnames.length)];
            return first + " " + last;
        }

        function changeName() {
            const type = getSelectedType();
            const newName = getRandomName(type);
            document.getElementById('nameField').value = newName;
        }

        function generatePassword() {
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*!";
            let pass = "";
            for (let i = 0; i < 8; i++) {
                pass += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            const today = new Date();
            const day = today.getDate().toString().padStart(2, '0');
            document.getElementById('passField').value = pass + day;
        }

        function copyText(fieldId, msgId) {
            const inputEl = document.getElementById(fieldId);
            if (!inputEl.value) return;
            navigator.clipboard.writeText(inputEl.value).then(() => {
                const msgDiv = document.getElementById(msgId);
                msgDiv.classList.remove('hidden');
                msgDiv.innerHTML = `<i class="fas fa-check-circle mr-1"></i> Copied to clipboard!`;
                msgDiv.classList.add('toast-copy');
                setTimeout(() => {
                    msgDiv.classList.add('hidden');
                    msgDiv.classList.remove('toast-copy');
                }, 1500);
            }).catch(() => alert("Manual copy"));
        }

        // ========== PREMIUM RIPPLE EFFECT ON ALL CLICKABLE ELEMENTS ==========
        function createRipple(event, element) {
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.style.position = 'absolute';
            ripple.style.pointerEvents = 'none';
            element.style.position = 'relative';
            element.style.overflow = 'hidden';
            element.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }
        
        // Attach ripple to all buttons and interactive labels
        const rippleElements = document.querySelectorAll('.btn-ripple, .ripple-label');
        rippleElements.forEach(el => {
            el.addEventListener('click', (e) => {
                createRipple(e, el);
            });
            // Also ensure that if the element has child elements, ripple still works
            el.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY };
                createRipple(fakeEvent, el);
            });
        });
        
        // Also add ripple to radio labels specifically (already covered by .ripple-label)
        // But we need to ensure radio inputs themselves don't cause double ripple
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('click', (e) => {
                e.stopPropagation();
                const parentLabel = radio.closest('label');
                if (parentLabel && parentLabel.classList.contains('ripple-label')) {
                    createRipple(e, parentLabel);
                }
            });
        });

        // Initialize everything instantly
        window.addEventListener('DOMContentLoaded', () => {
            changeName();
            generatePassword();
            AOS.init({ once: true, duration: 600, disable: window.innerWidth < 768 ? true : false });
        });

        // 3D TILT EFFECT (Desktop only)
        const card = document.getElementById('tilt-card');
        const container = card?.parentElement;
        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        
        if (card && container && !isMobile) {
            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateY = ((x - centerX) / centerX) * 6;
                const rotateX = ((y - centerY) / centerY) * -6;
                card.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            });
            container.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1200px) rotateX(0deg) rotateY(0deg) scale(1)`;
            });
        }

        // Custom Cursor (Desktop only)
        if (!isMobile) {
            const cursor = document.getElementById('custom-cursor');
            const dot = document.getElementById('cursor-dot');
            if (cursor && dot) {
                document.addEventListener('mousemove', (e) => {
                    cursor.style.transform = `translate(${e.clientX - 18}px, ${e.clientY - 18}px)`;
                    dot.style.transform = `translate(${e.clientX - 3}px, ${e.clientY - 3}px)`;
                });
                document.addEventListener('mousedown', () => {
                    cursor.style.transform += ' scale(0.7)';
                    dot.style.backgroundColor = '#00f2ea';
                });
                document.addEventListener('mouseup', () => {
                    cursor.style.transform = cursor.style.transform.replace(' scale(0.7)', '');
                    dot.style.backgroundColor = '#ff0050';
                });
            }
        }

        // Radio change updates name
        const radios = document.querySelectorAll('input[name="gender"]');
        radios.forEach(radio => {
            radio.addEventListener('change', () => changeName());
        });
    </script>
</body>
</html>
